apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: autoatendimento
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "Auto@Lanche2025"
        - name: POSTGRES_DB
          value: "autoatendimento"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: autoatendimento
spec:
  selector:
    app: postgres-db
  ports:
  - port: 5432
    targetPort: 5432
    